[project]
name = "bmad-auth"
version = "0.1.0"
description = "Simple REST API — Register, Login, Get Current User"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.13.0",
]

[project.scripts]
bmad-auth = "main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may use TestClient)",
    "api: API acceptance tests (HTTP-level)",
    "slow: Slow tests (bcrypt hashing, etc.)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
