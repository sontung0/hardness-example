[project]
name = "bmad-auth"
version = "0.1.0"
description = "Simple REST API — Register, Login, Get Current User"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
